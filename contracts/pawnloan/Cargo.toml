[package]
name = "pawnloan"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Collateralized pawn-loan escrow smart contract on Stellar (Soroban)"
repository = "https://github.com/ustaxs/PawnLoan"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]
doctest = false

[dependencies]
soroban-sdk = { workspace = true }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }
